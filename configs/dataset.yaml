  # Signer-Independent Split Strategy (Prevents data leakage)
  splits:
    strategy: "signer_independent"
    leakage_check: "zero_signer_overlap_verified"
    train_signers: 53
    train_instances: 635
    train_ratio: 0.697
    val_signers: 7
    val_instances: 146
    val_ratio: 0.160
    test_signers: 19
    test_instances: 130
    test_ratio: 0.143
    gloss_coverage_train: "40/40"
    gloss_coverage_val: "40/40"
    gloss_coverage_test: "40/40"

  # Video processing constraints
  video:
    min_duration_sec: 0.5
    max_duration_sec: 6.0
    standard_frames: 30
    min_resolution: 224
    accepted_formats:
      - ".mp4"
      - ".mov"
      - ".avi"

  # Storage paths (relative to project root)
  paths:
    raw_videos: "data/raw/"
    processed: "data/processed/"
    landmarks: "data/landmarks/"
    splits: "data/splits/"
    manifest: "data/splits/manifest.csv"

  # Alternative sources audited
  sources_audited:
    wlasl:
      name: "WLASL (Word-Level American Sign Language)"
      url: "https://dxli94.github.io/WLASL/"
      status: "APPROVED_PRIMARY"
      reason: "Isolated sign language taxonomy with verified signer metadata."
    how2sign:
      name: "How2Sign"
      url: "https://how2sign.github.io/"
      status: "REJECTED"
      reason: "Continuous sentence sign language requiring CTC/Seq2Seq. Storage (>30 GB) exceeds workstation headroom."
