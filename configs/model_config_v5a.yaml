# EchoGesture Phase 5A Accuracy Improvement Configuration
# Controlled experiments across velocity features and dynamic data augmentation

experiment:
  phase: "Phase 5A: Recognition Accuracy Improvement"
  name: "echogesture_accuracy_v5a"
  random_seed: 42
  track: "Track 2: Samsung XR Hackathon 2026"

dataset:
  manifest_path: "data/processed/landmarks_v3/feature_manifest.csv"
  preprocessed_dir: "data/processed/sequences_v3"
  sequence_length: 64
  num_classes: 40
  baseline_feature_dim: 134
  velocity_feature_dim: 263
  split_counts:
    train: 993
    val: 262
    test: 197
  validation_class_count: 39

experiments:
  exp_a:
    id: "EXP_A"
    name: "Baseline Compact TCN"
    feature_dim: 134
    use_velocity: false
    use_augmentation: false
  exp_b:
    id: "EXP_B"
    name: "Compact TCN + Velocity Features"
    feature_dim: 263
    use_velocity: true
    use_augmentation: false
  exp_c:
    id: "EXP_C"
    name: "Compact TCN + Dynamic Augmentation"
    feature_dim: 134
    use_velocity: false
    use_augmentation: true
  exp_d:
    id: "EXP_D"
    name: "Compact TCN + Velocity + Dynamic Augmentation"
    feature_dim: 263
    use_velocity: true
    use_augmentation: true

velocity_feature_specification:
  landmark_velocity_channels: 126   # 63 Left + 63 Right hand coordinates
  interaction_velocity_channels: 3   # Distance, dx, dy
  total_velocity_channels: 129
  spike_prevention: "Velocity non-zero strictly when hand present in both t and t-1"
  boundary_condition_t0: "Strictly 0.0"

augmentation_hyperparameters:
  temporal_speed_warp:
    enabled: true
    speed_min: 0.85
    speed_max: 1.15
  spatial_scaling:
    enabled: true
    scale_min: 0.90
    scale_max: 1.10
  coordinate_jitter:
    enabled: true
    gaussian_sigma: 0.005
  probability_per_sample: 0.70
  training_only: true  # Zero leakage into validation or test

training:
  batch_size: 32
  epochs: 80
  learning_rate: 0.001
  min_learning_rate: 0.00001
  optimizer: "adam"
  clipnorm: 1.0
  loss: "sparse_categorical_crossentropy"
  early_stopping:
    monitor: "val_loss"
    patience: 15
    restore_best_weights: true
  lr_reduction:
    monitor: "val_loss"
    factor: 0.5
    patience: 6
    min_lr: 0.00001

edge_deployment_constraints:
  max_parameters: 150000
  max_model_size_mb: 20.0
  target_latency_cpu_ms: 30.0
  tflite_builtin_compatibility: true

checkpoints:
  directory: "models/checkpoints"
  winning_model_path: "models/checkpoints/best_improved_model_v5a.keras"
  history_csv_path: "reports/phase5a_experiments_history.csv"
